<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Approve Purchase Request</title>
<meta name="theme-color" content="#2B3440">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<link rel="icon" type="image/png" href="../icon-192.png">
<!--
  Approval page for purchase requests. The approver's email links here with
  the request and a key for it after the #: approve/#PR-1001/key, or
  approve/#PR-1001/key/deny from the Deny button. The approver checks the
  request and receipt, picks the ministry account, adds a note, and approves
  or denies it. The script then emails the business office. Same look as the
  staff page. approve/#PR-1001/key/yes/1, from Yes, Approve when staff picked
  the account, approves it as it is as soon as the page opens, as long as it's
  still version 1 (unchanged since the email). approve/#PR-1001/key/quick
  opens a short version: the amount, the account as picked and a note,
  approved with one tap.
-->
<style>
  :root {
    --font-body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --bg: #F4F5F7; --card: #FFFFFF; --ink: #1C232B; --muted: #5B6470; --line: #E1E4E8; --line-strong: #CBD0D6;
    --input: #FFFFFF; --step-bg: #EEF0F3; --step-line: #CBD0D6; --step-ink: #1C232B;
    --heading: #2B3440; --rule: #8A94A3; --band-bg: #2B3440; --band-ink: #FFFFFF; --band-sub: #C9CFD8; --band-rule: #8A94A3;
    --btn-bg: #2563A8; --btn-ink: #FFFFFF; --focus: #2563A8; --danger: #B3261E; --danger-ink: #FFFFFF; --ok: #2F6B4F; --ok-ink: #FFFFFF;
    --warn-bg: #FDF0D5; --warn-ink: #7A4E00; --deny-bg: #FBE4E4; --deny-ink: #8A1F17; --yes-bg: #E5EEF9; --yes-ink: #1F4E86;
    --shadow: 0 1px 2px rgba(28, 35, 43, .06);
    --r-card: 8px; --r-ctl: 6px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #11151A; --card: #1A2027; --ink: #E7EAEE; --muted: #A0A8B3; --line: #2A323C; --line-strong: #39434F;
      --input: #141A20; --step-bg: #232B35; --step-line: #39434F; --step-ink: #E7EAEE;
      --heading: #C9CFD8; --btn-bg: #3B7DD8; --focus: #6AA5F0; --danger: #F2B8B5; --danger-ink: #2A0E0C; --ok: #7CC4A0; --ok-ink: #0E141E;
      --warn-bg: #3A2F16; --warn-ink: #F0C66B; --deny-bg: #3D1C1A; --deny-ink: #F2B8B5; --yes-bg: #1E3550; --yes-ink: #9CC3F0; --shadow: none;
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.4 var(--font-body); -webkit-tap-highlight-color: transparent; }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  [hidden] { display: none !important; }

  .top {
    display: flex; align-items: center; gap: 12px; min-height: 74px;
    padding: calc(14px + env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) 14px max(18px, env(safe-area-inset-left));
    background: var(--band-bg); color: var(--band-ink); border-bottom: 3px solid var(--band-rule);
  }
  .wordmark { display: grid; gap: 1px; min-width: 0; }
  .wordmark b { font-weight: 600; font-size: 19px; line-height: 1.1; letter-spacing: .01em; }
  .wordmark span { font-size: 12.5px; color: var(--band-sub); letter-spacing: .1em; text-transform: uppercase; }

  main {
    max-width: 560px; margin: 0 auto; display: grid; gap: 12px;
    padding: 12px max(12px, env(safe-area-inset-right)) 24px max(12px, env(safe-area-inset-left));
  }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-card); padding: 14px 16px 16px; box-shadow: var(--shadow); }
  h2 { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--heading); }
  .hint { font-size: 13px; color: var(--muted); margin: 6px 0 0; }

  .amount { font-size: 34px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .payto { color: var(--muted); font-size: 17px; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 700; background: var(--step-bg); color: var(--heading); }
  .badge.flag { background: var(--warn-bg); color: var(--warn-ink); }
  .badge.st-Approved, .badge.st-Paid { background: var(--yes-bg); color: var(--yes-ink); }
  .badge.st-Denied { background: var(--deny-bg); color: var(--deny-ink); }

  table { width: 100%; border-collapse: collapse; margin-top: 4px; }
  td { padding: 8px 0; vertical-align: top; border-top: 1px solid var(--line); }
  tr:first-child td { border-top: 0; }
  td:first-child { width: 120px; padding-right: 12px; color: var(--muted); font-size: 14px; }
  td:last-child { white-space: pre-wrap; overflow-wrap: anywhere; }

  .pages { display: grid; gap: 8px; margin-top: 10px; }
  .pages img { width: 100%; border: 1px solid var(--line-strong); border-radius: var(--r-ctl); background: #fff; }
  .receipt-note { color: var(--muted); margin: 8px 0 0; }

  .field { display: block; margin-top: 12px; }
  .field > span { display: block; font-size: 14px; color: var(--muted); margin-bottom: 4px; }
  select, textarea, .money {
    width: 100%; min-height: 48px; padding: 10px 12px; border: 1px solid var(--line-strong);
    border-radius: var(--r-ctl); background: var(--input); font-size: 16px;
  }
  select {
    -webkit-appearance: none; appearance: none; padding-right: 36px;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 20px) 50%, calc(100% - 14px) 50%; background-size: 6px 6px; background-repeat: no-repeat;
  }
  select.empty { color: var(--muted); }
  textarea { min-height: 96px; resize: vertical; }
  select:focus, textarea:focus, button:focus-visible, .money:focus-within { outline: 2px solid var(--focus); outline-offset: 1px; }
  .line { display: flex; gap: 8px; margin-top: 10px; }
  .line select { flex: 1; min-width: 0; }
  .line.split { flex-wrap: wrap; padding-top: 10px; border-top: 1px solid var(--line); }
  .line.split:first-child { border-top: 0; padding-top: 0; }
  .line.split select { flex: 1 1 0; }
  .line.split select.org { flex: 0 0 88px; }
  .line .break { flex-basis: 100%; height: 0; }
  .money { display: flex; align-items: center; gap: 4px; padding: 0 12px; flex: 1; }
  .money span { color: var(--muted); }
  .money input { border: 0; padding: 0; min-height: 46px; flex: 1; min-width: 0; background: transparent; font-variant-numeric: tabular-nums; outline: none; }
  .rm { flex: none; width: 48px; border: 1px solid var(--line-strong); border-radius: var(--r-ctl); background: var(--step-bg); color: var(--step-ink); font-size: 22px; line-height: 1; }
  .left { margin: 10px 0 0; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .left.off { color: var(--danger); }
  .left.even { color: var(--ok); }
  .picked { margin: 8px 0 0; font-size: 18px; font-weight: 600; }
  .picked span { font-weight: 400; color: var(--muted); }
  .textbtn { background: none; border: 0; padding: 10px 0 0; color: var(--heading); font-weight: 600; font-size: 15px; text-decoration: underline; text-underline-offset: 3px; }

  .decided { border-left: 5px solid var(--btn-bg); }
  .decided.no { border-left-color: var(--danger); }
  .decided p { margin: 6px 0 0; }
  .decided .say { font-size: 18px; font-weight: 600; margin: 0; }

  .bar {
    background: var(--band-bg); color: var(--band-ink); border-top: 3px solid var(--band-rule);
    padding: 20px max(16px, env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  .bar-inner { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: 1fr 2fr; gap: 10px; }
  .bar button { min-height: 54px; border-radius: var(--r-ctl); font-size: 18px; font-weight: 600; }
  .bar button:focus-visible { outline-color: #FFFFFF; }
  .primary { border: 0; background: var(--btn-bg); color: var(--btn-ink); padding: 0 20px; }
  .deny { background: transparent; border: 1px solid var(--band-rule); color: var(--band-ink); }
  .secondary { background: var(--step-bg); border: 1px solid var(--step-line); color: var(--step-ink); }
  .danger { border: 0; background: var(--danger); color: var(--danger-ink); }

  .loading { text-align: center; padding: 48px 16px; color: var(--muted); }

  .overlay { position: fixed; inset: 0; background: rgba(14, 18, 24, .55); display: flex; align-items: flex-end; justify-content: center; padding: 16px; z-index: 10; }
  @media (min-width: 600px) { .overlay { align-items: center; } }
  .sheet {
    width: 100%; max-width: 440px; background: var(--card); border-top: 3px solid var(--rule); border-radius: var(--r-card);
    padding: 22px 20px 18px; box-shadow: 0 10px 40px rgba(0, 0, 0, .25); margin-bottom: env(safe-area-inset-bottom);
  }
  .sheet h3 { margin: 0 0 6px; font-size: 22px; font-weight: 600; }
  .sheet p { margin: 0 0 18px; color: var(--muted); }
  .sheet .big { display: block; font-size: 30px; font-weight: 700; color: var(--ink); line-height: 1.1; margin-bottom: 2px; font-variant-numeric: tabular-nums; }
  .sheet-buttons { display: flex; gap: 10px; }
  .sheet-buttons button { flex: 1; min-height: 50px; border-radius: var(--r-ctl); font-weight: 600; padding: 0 12px; }
  .done { text-align: center; }
  .check { width: 60px; height: 60px; margin: 0 auto 12px; border-radius: 50%; background: var(--ok); display: grid; place-items: center; }
  .check::after { content: ""; width: 13px; height: 24px; border-right: 4px solid var(--ok-ink); border-bottom: 4px solid var(--ok-ink); transform: rotate(45deg) translate(-2px, -3px); }
  .spinner { width: 44px; height: 44px; margin: 4px auto 14px; border-radius: 50%; border: 4px solid var(--line); border-top-color: var(--heading); animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Account button and picker, as on the staff page */
  .acct {
    flex: 1; min-width: 0; min-height: 48px; display: grid; align-content: center; padding: 8px 36px 8px 12px; text-align: left;
    border: 1px solid var(--line-strong); border-radius: var(--r-ctl); background: var(--input); position: relative;
  }
  .acct::after { content: ""; position: absolute; right: 16px; top: 50%; width: 8px; height: 8px; margin-top: -6px;
    border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); }
  .acct span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .acct.empty span { color: var(--muted); }
  .line.split .acct { flex: 1 1 0; }
  .picker { align-items: stretch; padding: 0; }
  @media (min-width: 600px) { .picker { padding: 24px; align-items: center; } }
  .picker-sheet { width: 100%; max-width: 560px; background: var(--card); display: flex; flex-direction: column; max-height: 100%; padding-top: env(safe-area-inset-top); }
  @media (min-width: 600px) { .picker-sheet { border-radius: var(--r-card); max-height: 86vh; } }
  .picker-head { display: flex; align-items: center; gap: 10px; padding: 12px 12px 8px 16px; }
  .picker-head b { flex: 1; font-size: 20px; font-weight: 600; }
  .x { width: 44px; height: 44px; border: 0; border-radius: var(--r-ctl); background: var(--step-bg); color: var(--step-ink); font-size: 24px; line-height: 1; }
  .picker-search { padding: 0 16px 10px; border-bottom: 1px solid var(--line); }
  .picker-search input { width: 100%; min-height: 46px; padding: 10px 12px; border: 1px solid var(--line-strong); border-radius: var(--r-ctl); background: var(--input); font-size: 16px; }
  .picker-list { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 4px 8px calc(16px + env(safe-area-inset-bottom)); }
  .p-section { margin: 14px 8px 2px; font-size: 12.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--heading); }
  .p-group { margin: 10px 8px 2px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .p-item { display: flex; gap: 10px; width: 100%; min-height: 46px; align-items: center; padding: 8px; border: 0; border-radius: var(--r-ctl); background: none; text-align: left; }
  .p-item:hover, .p-item:focus-visible { background: var(--step-bg); }
  .p-item .num { flex: none; width: 44px; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; }
  .p-item[aria-selected="true"] { background: var(--step-bg); font-weight: 600; }
  .p-none { padding: 20px 8px; color: var(--muted); }

  /* Receipt page zoomed in */
  .pages img { cursor: zoom-in; }
  .zoom { position: fixed; inset: 0; z-index: 30; background: #0E1218; overflow: auto; -webkit-overflow-scrolling: touch; }
  .zoom img { display: block; width: 100%; height: auto; background: #fff; cursor: zoom-in; }
  .zoom.big img { width: 250%; max-width: none; cursor: zoom-out; }
  .zoom-bar { position: fixed; top: calc(10px + env(safe-area-inset-top)); right: 10px; left: 10px; display: flex; justify-content: space-between; align-items: center; pointer-events: none; z-index: 31; }
  .zoom-bar span { pointer-events: auto; background: rgba(14,18,24,.75); color: #fff; padding: 6px 12px; border-radius: 999px; font-size: 14px; }
  .zoom-bar .x { pointer-events: auto; background: rgba(14,18,24,.75); color: #fff; }

  .toast {
    position: fixed; left: 12px; right: 12px; bottom: calc(16px + env(safe-area-inset-bottom)); max-width: 536px; margin: 0 auto;
    background: var(--danger); color: var(--danger-ink); padding: 12px 14px; border-radius: var(--r-card); font-size: 15px; z-index: 60;
  }
</style>
</head>
<body>
  <header class="top">
    <div class="wordmark"><b id="topName">Business Office</b><span id="topSub">Purchase Request</span></div>
  </header>

  <div class="loading" id="loading"><p id="loadingText">Loading&hellip;</p></div>

  <main id="view" hidden>
    <section class="card">
      <div class="badges" id="badges"></div>
      <div class="amount" id="amount"></div>
      <div class="payto" id="payTo"></div>
      <button type="button" class="textbtn" id="more" hidden>Show Details and Receipt</button>
    </section>

    <section class="card decided" id="decided" hidden></section>

    <section class="card" id="detailsCard">
      <h2>Details</h2>
      <table id="details"></table>
    </section>

    <section class="card" id="receiptCard">
      <h2>Receipt</h2>
      <div class="pages" id="pages"></div>
      <p class="receipt-note" id="receiptNote">Loading the receipt&hellip;</p>
    </section>

    <div id="decide" hidden>
      <section class="card" id="acctCard">
        <h2 id="acctLabel">Ministry Account</h2>
        <p class="hint" id="acctHint" hidden></p>
        <div id="lines"></div>
        <p class="left" id="left" hidden></p>
        <button type="button" class="textbtn" id="split">Split Between Accounts</button>
        <button type="button" class="textbtn" id="addLine" hidden>Add Another Account</button>
        <button type="button" class="textbtn" id="change" hidden>Change Account</button>
      </section>

      <section class="card" id="noteCard" style="margin-top:12px">
        <h2>Note</h2>
        <label class="field"><span id="noteHint">Optional when approving, needed to deny. The business office sees it, and it prints on the purchase request.</span>
          <textarea id="notes" maxlength="2000"></textarea></label>
      </section>
    </div>
  </main>

  <div class="bar" id="bar" hidden>
    <div class="bar-inner">
      <button type="button" class="deny" id="denyBtn">Deny</button>
      <button type="button" class="primary" id="approveBtn">Approve</button>
    </div>
  </div>

  <div class="toast" id="toast" role="alert" hidden></div>

  <div class="overlay picker" id="picker" hidden>
    <div class="picker-sheet" role="dialog" aria-modal="true" aria-labelledby="pickerTitle">
      <div class="picker-head"><b id="pickerTitle">Pick an Account</b><button type="button" class="x" id="pickerClose" aria-label="Close">&times;</button></div>
      <div class="picker-search"><input type="search" id="pickerSearch" placeholder="Search by name or number" autocomplete="off" aria-label="Search accounts"></div>
      <div class="picker-list" id="pickerList"></div>
    </div>
  </div>

  <div class="zoom" id="zoom" role="dialog" aria-modal="true" aria-label="Receipt page" hidden>
    <img id="zoomImg" alt="">
  </div>
  <div class="zoom-bar" id="zoomBar" hidden><span id="zoomHint">Tap to zoom in</span><button type="button" class="x" id="zoomClose" aria-label="Close">&times;</button></div>

  <div class="overlay" id="dialog" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
      <div class="check" id="dialogCheck" hidden></div>
      <div class="spinner" id="dialogSpin" hidden></div>
      <h3 id="dialogTitle"></h3>
      <p id="dialogBody"></p>
      <div class="sheet-buttons" id="dialogButtons">
        <button type="button" class="secondary" id="dialogCancel">Cancel</button>
        <button type="button" class="primary" id="dialogOk">OK</button>
      </div>
    </div>
  </div>

<script src="../receipt.js"></script>
<script>
(() => {
  const API_URL = 'https://script.google.com/macros/s/AKfycbwD2Dcrut6h1VFBIcgtIpmLYK_KaPXJyvqmfpswCp3FeLeplsRnqLQLtUfq9TtFzE8A/exec';
  const ORG_NAMES = { GBC: 'Grace Baptist Church', ICA: 'Indiana Christian Academy', FRH: 'Fire Rescue House' };
  const NOT_SURE = '?';
  const MAX_LINES = 20;

  const $ = (sel) => document.querySelector(sel);
  let link = null;      // {id, key} from the address
  let request = null;   // the request as the sheet has it
  let accounts = [];
  let split = false;
  let lines = [];       // [{qb, amount}] being picked
  let quick = false;    // the short page: approve the account staff picked
  let receiptShown = false;

  function esc(s) {
    return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }
  // The sheet starts text that looks like a formula with ', which isn't part of it.
  function txt(s) { return String(s === null || s === undefined ? '' : s).replace(/^'/, ''); }
  function parseMoney(v) {
    const s = String(v || '').replace(/[$,\s]/g, '');
    if (!/^\d*\.?\d{0,2}$/.test(s) || s === '' || s === '.') return NaN;
    return Math.round(Number(s) * 100) / 100;
  }
  function dollars(n) { return '$' + (isFinite(n) ? Number(n) : 0).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
  function cents(n) { return Math.round(n * 100); }
  function dateLabel(value) {
    const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(value || ''));
    if (!m) return '';
    return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3])).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
  }
  /** True when a credit card purchase went on another organization's card. */
  function otherCard(r) { return r.type === 'Credit card' && !!ORG_NAMES[r.cardOrg] && r.cardOrg !== r.org; }

  // "6230 Art", or "GBC 5210 Youth" for another organization's account.
  function accountLabel(l) {
    if (l.qb === NOT_SURE) return 'Business office will choose';
    const org = l.org || request.org;
    const a = accounts.find((x) => x.org === org && x.qb === l.qb);
    return (org !== request.org ? org + ' ' : '') + (a ? (a.number ? a.number + ' ' : '') + a.name : l.qb);
  }

  let toastTimer;
  function toast(msg) {
    const t = $('#toast');
    t.textContent = msg;
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, 6000);
  }

  function dialog(opts) {
    return new Promise((resolve) => {
      $('#dialogTitle').textContent = opts.title;
      $('#dialogBody').innerHTML = opts.body || '';
      $('#dialogOk').textContent = opts.ok || 'OK';
      $('#dialogOk').className = opts.danger ? 'danger' : 'primary';
      $('#dialogCancel').hidden = !opts.cancel;
      $('#dialogCancel').textContent = opts.cancel || '';
      $('#dialogButtons').hidden = !!opts.busy;
      $('#dialogSpin').hidden = !opts.busy;
      $('#dialogCheck').hidden = !opts.check;
      $('.sheet').classList.toggle('done', !!opts.check || !!opts.busy);
      $('#dialog').hidden = false;
      if (opts.busy) return resolve();
      $('#dialogOk').focus();
      const finish = (ok) => {
        $('#dialog').hidden = true;
        $('#dialogOk').onclick = $('#dialogCancel').onclick = null;
        resolve(ok);
      };
      $('#dialogOk').onclick = () => finish(true);
      $('#dialogCancel').onclick = () => finish(false);
    });
  }

  async function api(body) {
    let res;
    try {
      const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify(Object.assign({ id: link.id, key: link.key }, body)) });
      res = await r.json();
    } catch (e) {
      throw new Error('Couldn\u2019t reach the business office sheet. Check your connection.');
    }
    if (res.status === 'error') throw new Error(res.message);
    return res;
  }

  // ---- Showing the request -----------------------------------------------------

  function render() {
    const r = request;
    document.title = 'Approve ' + r.id;
    $('#topName').textContent = ORG_NAMES[r.org] || 'Business Office';
    $('#topSub').textContent = 'Purchase Request ' + r.id;
    const badges = [];
    if (r.status !== 'New') badges.push('<span class="badge st-' + esc(r.status) + '">' + esc(r.status) + '</span>');
    if (otherCard(r)) badges.push('<span class="badge flag">Paid with ' + esc(r.cardOrg) + ' card</span>');
    if (r.receipt === 'To follow') badges.push('<span class="badge flag">Invoice to follow</span>');
    $('#badges').innerHTML = badges.join('');
    $('#badges').hidden = !badges.length;
    $('#amount').textContent = dollars(r.amount);
    $('#payTo').textContent = txt(r.payTo);

    const rows = [
      ['Organization', ORG_NAMES[r.org] || r.org],
      ...(r.cardholder ? [['Card', txt(r.cardholder) + (otherCard(r) ? ' (' + ORG_NAMES[r.cardOrg] + ' card)' : '')]] : []),
      ['Type', r.type],
      [r.type === 'Invoice' ? 'Invoice date' : 'Purchase date', dateLabel(r.date)],
      [r.payeeType === 'Individual' ? 'Pay to (individual)' : r.type === 'Credit card' ? 'Store or vendor' : 'Pay to (vendor)', txt(r.payTo)],
      ['Description', txt(r.description)],
      ['Requested by', txt(r.requestedBy) + (r.email ? ' <' + r.email + '>' : '')],
      ['Sent', dateLabel(r.submitted)],
    ];
    if (r.status !== 'New' || r.lines.length > 1 || (r.lines[0] && r.lines[0].qb !== NOT_SURE)) {
      rows.splice(4, 0, [r.lines.length > 1 ? 'Accounts' : 'Account', r.lines.map((l) =>
        accountLabel(l) + (r.lines.length > 1 ? ': ' + dollars(l.amount) : '')).join('\n')]);
    }
    $('#detailsCard').hidden = quick;
    $('#receiptCard').hidden = quick;
    $('#more').hidden = !quick;
    $('#details').innerHTML = rows.map((row) => '<tr><td>' + esc(row[0]) + '</td><td>' + esc(row[1]) + '</td></tr>').join('');

    const open = r.status === 'New';
    $('#decide').hidden = !open;
    $('#bar').hidden = !open;
    $('#decided').hidden = open;
    if (!open) {
      const yes = r.status === 'Approved' || r.status === 'Paid';
      const who = r.approvedBy ? ' by ' + esc(r.approvedBy) + (r.approvedOn ? ' on ' + esc(dateLabel(r.approvedOn)) : '') : '';
      const say = r.status === 'Approved' ? 'Approved' + who + '.'
        : r.status === 'Denied' ? 'Denied' + who + '.'
          : r.status === 'Paid' ? 'Approved' + who + ', and paid.'
            : 'The business office voided this request.';
      $('#decided').className = 'card decided' + (yes ? '' : ' no');
      $('#decided').innerHTML = '<p class="say">' + say + '</p>' +
        (r.approverNotes ? '<p><b>Note:</b> ' + esc(txt(r.approverNotes)) + '</p>' : '') +
        '<p class="hint">' + (r.status === 'Approved' ? 'The business office has the purchase request to print. '
          : r.status === 'Denied' ? 'The business office has your note. ' : '') +
        'To change it, ask the business office.</p>';
    }
  }

  async function showReceipt() {
    if (receiptShown) return;
    receiptShown = true;
    if (!String(request.files || '').trim()) {
      $('#receiptNote').textContent = request.receipt === 'To follow' ? 'The invoice hasn\u2019t come yet.' : 'No receipt is attached.';
      return;
    }
    try {
      const res = await api({ action: 'approveReceipt' });
      const pages = [];
      for (const f of res.files) {
        if (/pdf/i.test(f.type)) pages.push(...await Receipt.pageImages(f.data));
        else if (/^image\//.test(f.type)) pages.push('data:' + f.type + ';base64,' + f.data);
      }
      $('#pages').innerHTML = pages.map((src, i) => '<img src="' + src + '" data-page="' + i + '" alt="Receipt page ' + (i + 1) + '">').join('');
      $('#receiptNote').textContent = (pages.length > 1 ? pages.length + ' pages. ' : '') + 'Tap a page to see it bigger. It\u2019s also attached to the email.';
    } catch (e) {
      $('#receiptNote').textContent = 'The receipt couldn\u2019t be shown here. It\u2019s attached to the email.';
    }
  }

  // ---- Picking the accounts ----------------------------------------------------

  function renderLines() {
    $('#change').hidden = !quick;
    $('#acctHint').hidden = !quick;
    if (quick) {
      $('#acctHint').textContent = 'Picked by ' + txt(request.requestedBy) + '.';
      $('#lines').innerHTML = lines.map((l) => '<p class="picked">' + esc(accountLabel(l)) +
        (split ? ' <span>' + dollars(parseMoney(l.amount)) + '</span>' : '') + '</p>').join('');
      $('#split').hidden = $('#addLine').hidden = $('#left').hidden = true;
      $('#acctLabel').textContent = split ? 'Ministry Accounts' : 'Ministry Account';
      return;
    }
    // A split can take accounts from more than one ministry, so each line picks its organization.
    $('#lines').innerHTML = lines.map((l, i) =>
      '<div class="line' + (split ? ' split' : '') + '">' +
      (split || l.org !== request.org ? '<select class="org" data-org="' + i + '" aria-label="Organization for account ' + (i + 1) + '">' +
        Object.keys(ORG_NAMES).map((k) => '<option value="' + k + '"' + (l.org === k ? ' selected' : '') + '>' + k + '</option>').join('') + '</select>' : '') +
      '<button type="button" class="acct' + (l.qb ? '' : ' empty') + '" data-pick="' + i + '" aria-label="Account ' + (i + 1) + ': ' + esc(l.qb ? accountLabel(l) : 'Pick an Account') + '">' +
        '<span>' + esc(l.qb ? accountLabel(l) : 'Pick an Account') + '</span></button>' +
      (split ? '<div class="break"></div><label class="money"><span>$</span><input data-amt="' + i + '" inputmode="decimal" autocomplete="off" placeholder="0.00" value="' + esc(l.amount) + '" aria-label="Amount for account ' + (i + 1) + '"></label>' +
        '<button type="button" class="rm" data-rm="' + i + '" aria-label="Remove account ' + (i + 1) + '">&times;</button>' : '') +
      '</div>').join('');
    $('#split').hidden = split;
    $('#addLine').hidden = !split;
    $('#acctLabel').textContent = split ? 'Ministry Accounts' : 'Ministry Account';
    renderLeft();
  }

  function renderLeft() {
    const el = $('#left');
    el.hidden = !split;
    if (!split) return;
    const used = lines.reduce((n, l) => n + (cents(parseMoney(l.amount)) || 0), 0);
    const left = cents(request.amount) - used;
    el.className = 'left' + (left === 0 ? ' even' : left < 0 ? ' off' : '');
    el.textContent = left === 0 ? 'Adds up to ' + dollars(request.amount) + '.'
      : left > 0 ? dollars(left / 100) + ' still to assign.' : dollars(-left / 100) + ' more than the total.';
  }

  $('#lines').addEventListener('change', (e) => {
    if (e.target.dataset.org !== undefined) {
      const l = lines[Number(e.target.dataset.org)];
      l.org = e.target.value;
      if (!accounts.some((a) => a.org === l.org && a.qb === l.qb)) l.qb = '';
      renderLines();
      return;
    }
  });
  $('#lines').addEventListener('input', (e) => {
    if (e.target.dataset.amt === undefined) return;
    lines[Number(e.target.dataset.amt)].amount = e.target.value;
    renderLeft();
  });
  $('#lines').addEventListener('focusout', (e) => {
    if (e.target.dataset.amt === undefined) return;
    const v = parseMoney(e.target.value);
    if (isFinite(v)) e.target.value = lines[Number(e.target.dataset.amt)].amount = v.toFixed(2);
  });
  $('#lines').addEventListener('click', (e) => {
    const pick = e.target.closest('[data-pick]');
    if (pick) return openPicker(Number(pick.dataset.pick));
    const b = e.target.closest('[data-rm]');
    if (!b) return;
    lines.splice(Number(b.dataset.rm), 1);
    if (lines.length === 1) { split = false; lines[0].amount = ''; }
    renderLines();
  });
  $('#split').addEventListener('click', () => {
    split = true;
    lines = [{ org: lines[0].org, qb: lines[0].qb, amount: Number(request.amount).toFixed(2) }, { org: request.org, qb: '', amount: '' }];
    renderLines();
  });
  // Leaves the short page for the full one, to change the account or see the receipt.
  function fullPage() {
    quick = false;
    render();
    renderLines();
    showReceipt();
  }
  $('#change').addEventListener('click', () => {
    fullPage();
    $('#acctCard').scrollIntoView({ behavior: 'smooth', block: 'center' });
    if (!split) openPicker(0);
  });

  // The account list, with a search box: the line's organization's accounts by section and group.
  let pickFor = 0;
  function openPicker(i) {
    pickFor = i;
    $('#pickerSearch').value = '';
    $('#pickerTitle').textContent = lines[i].org === request.org ? 'Pick an Account' : 'Pick a ' + lines[i].org + ' Account';
    renderPicker('');
    $('#picker').hidden = false;
    document.documentElement.style.overflow = 'hidden';
    // On phones, a keyboard right away hides most of the list.
    if (window.matchMedia('(pointer: fine)').matches) $('#pickerSearch').focus();
    const on = $('#pickerList [aria-selected="true"]');
    if (on) on.scrollIntoView({ block: 'center' });
  }
  function closePicker() {
    $('#picker').hidden = true;
    document.documentElement.style.overflow = '';
  }
  function renderPicker(query) {
    const words = query.toLowerCase().split(/\s+/).filter(Boolean);
    const line = lines[pickFor];
    const hits = accounts.filter((a) => {
      if (a.org !== line.org) return false;
      const hay = (a.number + ' ' + a.name + ' ' + a.group + ' ' + a.section).toLowerCase();
      return words.every((w) => hay.indexOf(w) !== -1);
    });
    let html = '';
    let section = '';
    let group = '';
    hits.forEach((a) => {
      if (a.section !== section) {
        section = a.section;
        group = '';
        html += '<div class="p-section">' + esc(section) + '</div>';
      }
      if (a.group !== group) {
        group = a.group;
        html += '<div class="p-group">' + esc(group) + '</div>';
      }
      html += '<button type="button" class="p-item" data-qb="' + esc(a.qb) + '" aria-selected="' + (line.qb === a.qb) + '">' +
        '<span class="num">' + esc(a.number) + '</span><span>' + esc(a.name) + '</span></button>';
    });
    if (!hits.length) html = '<p class="p-none">' + (words.length ? 'No account matches \u201c' + esc(query) + '\u201d.' : 'No accounts.') + '</p>';
    $('#pickerList').innerHTML = html;
  }
  $('#pickerSearch').addEventListener('input', () => renderPicker($('#pickerSearch').value));
  $('#pickerClose').addEventListener('click', closePicker);
  $('#pickerList').addEventListener('click', (e) => {
    const b = e.target.closest('[data-qb]');
    if (!b) return;
    lines[pickFor].qb = b.dataset.qb;
    closePicker();
    renderLines();
  });

  // Tapping a receipt page shows it full screen; tapping again zooms in where you tapped.
  $('#pages').addEventListener('click', (e) => {
    const img = e.target.closest('img');
    if (!img) return;
    $('#zoomImg').src = img.src;
    $('#zoomImg').alt = img.alt;
    $('#zoom').classList.remove('big');
    $('#zoomHint').textContent = 'Tap to zoom in';
    $('#zoom').hidden = $('#zoomBar').hidden = false;
    $('#zoom').scrollTo(0, 0);
    document.documentElement.style.overflow = 'hidden';
  });
  $('#zoomImg').addEventListener('click', (e) => {
    const box = $('#zoom');
    const r = $('#zoomImg').getBoundingClientRect();
    const fx = (e.clientX - r.left) / r.width;
    const fy = (e.clientY - r.top) / r.height;
    const big = box.classList.toggle('big');
    $('#zoomHint').textContent = big ? 'Tap to zoom out' : 'Tap to zoom in';
    const nr = $('#zoomImg').getBoundingClientRect();
    box.scrollTo(big ? fx * nr.width - box.clientWidth / 2 : 0, big ? fy * nr.height - box.clientHeight / 2 : 0);
  });
  function closeZoom() {
    $('#zoom').hidden = $('#zoomBar').hidden = true;
    document.documentElement.style.overflow = '';
  }
  $('#zoomClose').addEventListener('click', closeZoom);
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (!$('#picker').hidden) closePicker();
    if (!$('#zoom').hidden) closeZoom();
  });
  $('#more').addEventListener('click', fullPage);
  $('#addLine').addEventListener('click', () => {
    if (lines.length >= MAX_LINES) return toast('A request can be split across at most ' + MAX_LINES + ' accounts.');
    lines.push({ org: request.org, qb: '', amount: '' });
    renderLines();
  });

  // ---- Deciding ----------------------------------------------------------------

  function picked() {
    if (lines.some((l) => !l.qb)) return [null, split ? 'Pick an account for each line.' : 'Pick the ministry account.'];
    if (!split) return [[{ org: lines[0].org, qb: lines[0].qb, amount: request.amount }]];
    const out = lines.map((l) => ({ org: l.org, qb: l.qb, amount: parseMoney(l.amount) }));
    if (out.some((l) => !(l.amount > 0))) return [null, 'Enter an amount for each account.'];
    const used = out.reduce((n, l) => n + cents(l.amount), 0);
    if (used !== cents(request.amount)) return [null, 'The accounts add up to ' + dollars(used / 100) + ', not ' + dollars(request.amount) + '.'];
    return [out];
  }

  /** version: from Yes, Approve, which approves the request only as the email showed it. */
  async function decide(deny, version) {
    const notes = $('#notes').value.trim();
    let chosen = null;
    if (deny) {
      if (!notes) {
        toast('Add a note saying why it\u2019s denied.');
        $('#noteCard').scrollIntoView({ behavior: 'smooth', block: 'center' });
        $('#notes').focus({ preventScroll: true });
        return;
      }
    } else {
      const check = picked();
      if (!check[0]) {
        toast(check[1]);
        $('#acctCard').scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }
      chosen = check[0];
    }
    $('#toast').hidden = true;
    const r = request;
    const acctText = deny ? '' : chosen.map((l) => esc(accountLabel(l)) + (chosen.length > 1 ? ' ' + dollars(l.amount) : '')).join('<br>');
    // On the short page, Yes, Approve in the email and Approve here are enough.
    const ok = !deny && (quick || version) ? true : await dialog(deny ? {
      title: 'Deny ' + r.id + '?',
      body: '<span class="big">' + dollars(r.amount) + '</span>' + esc(txt(r.payTo)) + '<br><br>The business office gets your note.',
      ok: 'Deny', cancel: 'Go Back', danger: true,
    } : {
      title: 'Approve ' + r.id + '?',
      body: '<span class="big">' + dollars(r.amount) + '</span>' + esc(txt(r.payTo)) + '<br>' + acctText +
        '<br><br>The business office gets the purchase request to print.',
      ok: 'Approve', cancel: 'Go Back',
    });
    if (!ok) return;
    dialog({ title: deny ? 'Denying\u2026' : 'Approving\u2026', busy: true });
    let res;
    try {
      res = await api({ action: 'approveDecide', decision: deny ? 'deny' : 'approve', lines: chosen || [], notes: notes, version: version || 0 });
    } catch (e) {
      $('#dialog').hidden = true;
      return toast(e.message);
    }
    request = res.request;
    if (res.status === 'changed') {
      // The office changed it after the email went out: show it as it is now.
      $('#dialog').hidden = true;
      useRequest();
      quick = false;
      render();
      renderLines();
      showReceipt();
      return dialog({ title: 'This Request Changed', body: 'The business office changed it after your email was sent, so it wasn\u2019t approved. Check it, then tap Approve.', ok: 'OK' });
    }
    quick = false;
    render();
    showReceipt();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    if (res.status === 'decided') {
      await dialog({ title: 'Already ' + (request.status === 'Void' ? 'Voided' : request.status), body: 'Someone already decided this one. Nothing was changed.', ok: 'OK' });
    } else {
      await dialog({
        title: deny ? 'Denied' : 'Approved', check: true, ok: 'Done',
        body: deny ? 'The business office has your note.' : 'The business office has the purchase request to print.',
      });
    }
  }
  $('#approveBtn').addEventListener('click', () => decide(false));
  $('#denyBtn').addEventListener('click', () => decide(true));

  // ---- Start -------------------------------------------------------------------

  async function start() {
    const m = /^#(PR-\d+)\/([\w-]+)(\/(deny|quick|yes\/(\d+)))?$/.exec(location.hash);
    if (!m) {
      $('#loadingText').textContent = 'This link isn\u2019t complete. Open it again from the email.';
      return;
    }
    link = { id: m[1], key: m[2] };
    // Drop /deny, /quick or /yes, so a reload shows the full page and can't approve again.
    if (m[3]) history.replaceState(null, '', '#' + link.id + '/' + link.key);
    let res;
    try {
      res = await api({ action: 'approveLoad' });
    } catch (e) {
      $('#loadingText').textContent = e.message;
      return;
    }
    request = res.request;
    accounts = res.accounts;
    useRequest();
    const yes = m[5] ? Number(m[5]) : 0;
    quick = (m[4] === 'quick' || yes > 0) && request.status === 'New' && lines.every((l) => l.qb);
    $('#loading').hidden = true;
    $('#view').hidden = false;
    render();
    renderLines();
    if (m[4] === 'deny' && request.status === 'New') {
      $('#noteHint').textContent = 'Say why it\u2019s denied, then tap Deny. The business office sees your note.';
      $('#noteCard').scrollIntoView({ block: 'center' });
      $('#notes').focus({ preventScroll: true });
    }
    if (!quick) showReceipt();
    if (yes && quick) decide(false, yes);
  }

  /** The lines to pick from, as the request has them. */
  function useRequest() {
    split = request.lines.length > 1;
    lines = (request.lines.length ? request.lines : [{ qb: '', amount: '' }]).map((l) => ({
      org: l.org || request.org,
      qb: l.qb === NOT_SURE ? '' : l.qb,
      amount: split ? Number(l.amount).toFixed(2) : '',
    }));
  }
  start();
})();
</script>
</body>
</html>
